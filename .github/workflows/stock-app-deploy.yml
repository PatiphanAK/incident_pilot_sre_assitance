# stock_app — full CI/CD loop (GitHub Actions -> ECR -> ECS Fargate).
#
#   push to main (stock_app files) or manual run
#     -> go vet + go test
#     -> docker build + push to ECR
#     -> register task definition with the image just built
#     -> stop the running task
#     -> run the new Fargate task
#     -> wait for RUNNING
#     -> print the public IP
#
# AWS auth is OIDC (no stored AWS access keys).

name: stock_app deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/target_app/stock_app/**'
      - '.github/workflows/stock-app-deploy.yml'
  workflow_dispatch: {}

# Required for GitHub OIDC authentication.
permissions:
  id-token: write
  contents: read

# Prevent two deployments from racing each other.
concurrency:
  group: stock-app-deploy
  cancel-in-progress: true

env:
  APP_DIR: apps/target_app/stock_app

  # AWS
  ACCOUNT: '204936843729'
  REGION: ap-southeast-1

  # ECS
  CLUSTER: stock-cluster
  TASK_FAMILY: stock-app

  # ECR
  ECR_REPO: stock-app

  # IAM deploy role
  DEPLOY_ROLE: stock-app-deploy

  # Network
  SUBNET: subnet-03cf78421c00c8c4b
  SG: sg-0abdc6065c9434654

jobs:
  ci-cd:
    name: test, build, deploy
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Validate deployment configuration
      # ============================================================

      - name: Fail fast on unset deploy config
        run: |
          case "$SUBNET" in
            ''|subnet-REPLACE_ME)
              echo "::error::SUBNET is not set."
              exit 1
              ;;
          esac


      # ============================================================
      # CI
      # ============================================================

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: go vet
        working-directory: ${{ env.APP_DIR }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ env.APP_DIR }}
        run: go test ./...

      # ============================================================
      # AWS Authentication
      # ============================================================
      # GitHub Actions
      #     -> OIDC token
      #     -> AWS STS
      #     -> stock-app-deploy IAM role
      #
      # No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY required.

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.REGION }}


      # ============================================================
      # ECR
      # ============================================================

      - name: Login to ECR
        run: |
          aws ecr get-login-password \
            --region "$REGION" \
            | docker login \
                --username AWS \
                --password-stdin \
                "$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"

      - name: Build and push image
        run: |
          set -euo pipefail

          IMAGE="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO:${GITHUB_SHA}"

          echo "Building image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            "$APP_DIR"

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"


      # ============================================================
      # ECS Task Definition
      # ============================================================

      - name: Register task definition
        run: |
          set -euo pipefail

          echo "Rendering task definition..."

          jq \
            --arg image "$IMAGE" \
            '.containerDefinitions[0].image = $image' \
            "$APP_DIR/task-definition.json" \
            > /tmp/task-definition.rendered.json

          echo "Registering task definition..."

          TASK_DEFINITION_ARN=$(
            aws ecs create-task-definition \
              --region "$REGION" \
              --task-definition file:///tmp/task-definition.rendered.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )

          echo "Registered:"
          echo "$TASK_DEFINITION_ARN"


      # ============================================================
      # ECS Deployment
      # ============================================================

      - name: Deploy — stop old task and start new task
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Stop currently running task(s)
          # --------------------------------------------------------

          echo "Checking for existing running tasks..."

          RUNNING_TASKS=$(
            aws ecs list-tasks \
              --region "$REGION" \
              --cluster "$CLUSTER" \
              --family "$TASK_FAMILY" \
              --desired-status RUNNING \
              --query 'taskArns[]' \
              --output text
          )

          for arn in $RUNNING_TASKS; do
            echo "Stopping old task: $arn"

            aws ecs stop-task \
              --region "$REGION" \
              --cluster "$CLUSTER" \
              --task "$arn"
          done


          # --------------------------------------------------------
          # Build network configuration
          # --------------------------------------------------------

          NET="awsvpcConfiguration={subnets=[$SUBNET]"

          if [ -n "$SG" ]; then
            NET="$NET,securityGroups=[$SG]"
          fi

          NET="$NET,assignPublicIp=ENABLED}"

          echo "Network configuration:"
          echo "$NET"


          # --------------------------------------------------------
          # Start new Fargate task
          # --------------------------------------------------------

          echo "Starting new Fargate task..."

          TASK_ARN=$(
            aws ecs run-task \
              --region "$REGION" \
              --cluster "$CLUSTER" \
              --task-definition "$TASK_FAMILY" \
              --launch-type FARGATE \
              --network-configuration "$NET" \
              --query 'tasks[0].taskArn' \
              --output text
          )

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::ECS failed to start the task."
            exit 1
          fi

          echo "New task:"
          echo "$TASK_ARN"


          # --------------------------------------------------------
          # Wait until task is RUNNING
          # --------------------------------------------------------

          echo "Waiting for task to reach RUNNING..."

          aws ecs wait tasks-running \
            --region "$REGION" \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN"

          echo "Task is RUNNING."


          # --------------------------------------------------------
          # Get ENI
          # --------------------------------------------------------

          ENI_ID=$(
            aws ecs describe-tasks \
              --region "$REGION" \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query "tasks[0].attachments[?name=='eni'].details[?name=='networkInterfaceId'].value" \
              --output text \
              || true
          )

          echo "ENI:"
          echo "$ENI_ID"


          # --------------------------------------------------------
          # Get public IP
          # --------------------------------------------------------

          PUBLIC_IP=""

          if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then

            PUBLIC_IP=$(
              aws ec2 describe-network-interfaces \
                --region "$REGION" \
                --network-interface-ids "$ENI_ID" \
                --query 'NetworkInterfaces[0].Association.PublicIp' \
                --output text \
                || true
            )

          fi


          # --------------------------------------------------------
          # Deployment summary
          # --------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "        stock_app deployment complete"
          echo "=========================================="
          echo ""
          echo "Task:"
          echo "$TASK_ARN"
          echo ""

          if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
            echo "Health:"
            echo "http://$PUBLIC_IP:8080/health"
            echo ""

            echo "Docs:"
            echo "http://$PUBLIC_IP:8080/docs"
          else
            echo "Public IP: <pending>"
          fi

          echo ""
          echo "=========================================="
