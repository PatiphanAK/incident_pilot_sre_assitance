<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stock_app API — v1</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  window.ui = SwaggerUIBundle({
    url: '/doc/api/v1/openapi.yaml',   // absolute: relative resolution from a
                                        // non-slash page URL (…/doc/api/v1) would
                                        // otherwise resolve to …/doc/openapi.yaml
    dom_id: '#swagger-ui',
    // "it can call": Try it out enabled by default, and the bearer token
    // survives page reloads during a demo.
    tryItOutEnabled: true,
    persistAuthorization: true,
    deepLinking: true
  });
</script>
</body>
</html>
