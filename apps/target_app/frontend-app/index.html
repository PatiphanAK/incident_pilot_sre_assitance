<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Stock System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container">
        <span class="navbar-brand mb-0 h1">📦 Target App: Stock Management</span>
        <span class="navbar-text text-light" id="navStatus">🔴 Not Logged In</span>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row">
        <!-- 1. Authentication Section -->
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
              <h5 class="card-title text-primary">1. Authentication</h5>
            </div>
            <div class="card-body">
              <input type="email" id="emailInput" class="form-control mb-2" placeholder="Email" value="test@example.com">
              <input type="password" id="passwordInput" class="form-control mb-3" placeholder="Password" value="password123">
              <button id="loginBtn" class="btn btn-primary w-100 mb-3">🔐 Login</button>
              <div class="alert alert-secondary text-truncate small mb-0" id="tokenDisplay">Token จะแสดงที่นี่</div>
            </div>
          </div>
        </div>

        <!-- 2. Products Section -->
        <div class="col-md-8">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
              <h5 class="card-title text-success">2. Available Products</h5>
            </div>
            <div class="card-body">
              <div id="productList" class="text-center py-4 text-muted">กรุณาล็อกอินเพื่อดูรายการสินค้า...</div>
            </div>
          </div>

          <!-- System Logs -->
          <div class="mt-4 p-3 bg-dark text-light rounded shadow-sm" style="font-family: monospace;">
            <span class="text-warning">System Logs:</span>
            <hr class="border-secondary my-2">
            <div id="orderStatus" class="small text-info">Waiting for action...</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
