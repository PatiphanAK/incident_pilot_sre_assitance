AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Incident Pilot — Command Lambda.
  Thin command-submission layer: API Gateway -> Lambda -> SQS.
  DB-free: validate, generate run_id, enqueue, return 202.

Parameters:
  StageName:
    Type: String
    Default: Dev
    Description: API Gateway stage name.
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Value for Access-Control-Allow-Origin. Lock down for production.

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 256
    Timeout: 10
    Architectures:
      - arm64

Resources:
  # --- Async execution boundary -------------------------------------------
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub incident-pilot-runs-dlq
      VisibilityTimeout: 1200   # 20 min; poison messages leave the queue anyway

  RunQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub incident-pilot-runs
      # Long runs on the worker: give it 20 min of visibility per receive; the
      # worker should extend via ChangeMessageVisibility for the 5–20 min loop.
      VisibilityTimeout: 1200
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  # --- Command-submission Lambda -------------------------------------------
  CommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub incident-pilot-command-${StageName}
      Description: Validate incident commands and enqueue run jobs to SQS.
      CodeUri: src
      Handler: command_lambda.handler.lambda_handler
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref RunQueue
          SQS_QUEUE_ARN: !GetAtt RunQueue.Arn
      Events:
        SubmitRun:
          Type: Api
          Properties:
            Path: /runs
            Method: POST
            # Auth NONE for the demo. Lock down (Cognito/IAM) before production.
            Auth:
              ApiKeyRequired: false
      Policies:
        # Least privilege: only send to this specific queue + write logs.
        - SQSSendMessagePolicy:
            QueueName: !GetAtt RunQueue.QueueName
            QueueArn: !GetAtt RunQueue.Arn
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/incident-pilot-command-${StageName}:*"

  # Explicit log group so retention is defined (SAM auto-creates otherwise).
  CommandLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/incident-pilot-command-${StageName}"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL of the command API (POST /runs here).
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/runs"
  RunQueueUrl:
    Description: URL of the SQS run queue (consumed by the future ECS worker).
    Value: !Ref RunQueue
  RunQueueArn:
    Description: ARN of the SQS run queue.
    Value: !GetAtt RunQueue.Arn
  DeadLetterQueueUrl:
    Description: URL of the DLQ for poison messages.
    Value: !Ref DeadLetterQueue
  CommandFunctionArn:
    Description: ARN of the command-submission Lambda.
    Value: !GetAtt CommandFunction.Arn
