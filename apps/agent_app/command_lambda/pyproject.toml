[project]
name = "command-lambda"
version = "0.1.0"
description = "Incident Pilot — thin command-submission Lambda (API Gateway -> Lambda -> SQS). DB-free: validate, generate run_id, enqueue, return 202."
readme = "README.md"
requires-python = ">=3.13"
# Runtime code is stdlib-only; boto3 is provided by the Lambda runtime.
# All dependencies below are DEV-only (tests + local FastAPI shim).
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "fastapi[standard]>=0.141.1",
    "boto3>=1.43.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/command_lambda"]
